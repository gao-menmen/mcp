[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-mcp"
version = "0.2.0"
description = "MCP server for querying databases, LSF clusters, and machine info"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "psutil",
    "pymysql",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
