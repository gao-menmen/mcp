[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-mcp"
version = "0.1.0"
description = "MCP server for querying MySQL, SQLite, and Power BI (PBIX)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pymysql",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
